[package]
name = "dictation"
version = "0.0.1"
description = "Offline dictation + LLM rewrite (macOS / Windows). Phase 1a scaffold per ADR-001 + ADR-002."
authors = ["Motohashi Shinichi <fatshin@gmail.com>"]
edition = "2021"
publish = false

[lib]
name = "dictation_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-global-shortcut = "2.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-util = "0.7"
async-trait = "0.1"
uuid = { version = "1", features = ["v4"] }
zeroize = { version = "1", features = ["derive"] }
log = "0.4"
pin-project-lite = "0.2"
scopeguard = "1"

# LLM (Ollama HTTP loopback per ADR-002)
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"

# ASR — Metal is macOS-only. Linux/Windows fall through to the
# whisper-rs CPU backend (default features), and CUDA/Vulkan can be
# opt-in via cargo --features later for the gaming-tier Windows
# target. The previous unconditional ["metal"] feature caused
# whisper.cpp's CMakeLists to call find_library on Metal even on
# Linux/Windows, which obviously fails.
whisper-rs = { version = "0.16", default-features = false }
cpal = "0.15"
earshot = "1.1"
rubato = "2.0"
rtrb = "0.3"

# Text injection
enigo = "0.6"

# History DB
rusqlite = { version = "0.32", features = ["bundled-sqlcipher"] }

# macOS keystore + CGEventTap (fn key) + Accessibility API (focused field context)
# + whisper-rs with the Metal backend.
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"
core-foundation = "0.10"
core-graphics = "0.24"
accessibility-sys = "0.1"
whisper-rs = { version = "0.16", default-features = false, features = ["metal"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
