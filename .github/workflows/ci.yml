name: CI

# W0 — Build green across the three target OSes.
# Per WINDOWS_PLAN.md: the matrix is what gates Phase 1b kickoff.
# The Linux entry is for the maintainers / library checks; Linux is
# not a product target (CLAUDE.md).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------------
  # Frontend: TypeScript + Vite + Playwright (no OS-specific bits).
  # Runs once on Linux to keep cost down.
  # -------------------------------------------------------------------
  frontend:
    name: Frontend (tsc + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: TypeScript check (app sources)
        run: pnpm tsc --noEmit -p tsconfig.json --skipLibCheck

      - name: Vite build
        run: pnpm build

      - name: Upload dist artefact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist/
          retention-days: 7

  # -------------------------------------------------------------------
  # Rust backend: cargo check + cargo test on all three OSes.
  # Tauri is not bundled here (that's a release workflow); we only
  # confirm the Rust code compiles and unit tests pass per-platform.
  # -------------------------------------------------------------------
  rust:
    name: Rust (${{ matrix.os }} / ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos
            arch: arm64
            runner: macos-14
            target: aarch64-apple-darwin
          - os: linux
            arch: x64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows
            arch: x64
            runner: windows-2022
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      # Linux: Tauri / GTK system deps + ALSA (cpal backend).
      # OpenSSL is no longer needed because rusqlite uses
      # bundled-sqlcipher-vendored-openssl now.
      - name: Install Linux system deps
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libasound2-dev \
            libpulse-dev \
            cmake \
            clang \
            pkg-config

      # Windows: cmake + LLVM are needed by whisper-rs (whisper.cpp
      # builds via its build script). msvc toolchain comes with the
      # windows-2022 image. OpenSSL is no longer needed at the system
      # level because rusqlite vendors it.
      - name: Install Windows build deps
        if: matrix.os == 'windows'
        run: |
          choco install -y --no-progress llvm cmake
        shell: pwsh

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: clippy, rustfmt

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      # Linux + Windows do not have the macOS keystore / focus / fn-key
      # modules compiled in. That's intentional — the codebase already
      # gates those behind cfg(target_os = "macos") and falls back to
      # stubs. Cargo check is the gate that those cfgs still hold.
      - name: cargo fmt
        working-directory: src-tauri
        run: cargo fmt --all --check

      - name: cargo check
        working-directory: src-tauri
        run: cargo check --all-targets --target ${{ matrix.target }}

      - name: cargo clippy
        working-directory: src-tauri
        # W0 ships clippy as advisory (continue-on-error: true). The
        # existing tree has ~9 new_without_default lints that we
        # intentionally don't fix in W0 — clippy hygiene is its own
        # cleanup task. Tighten to `-D warnings` once the lint backlog
        # is cleared in a follow-up PR.
        run: cargo clippy --target ${{ matrix.target }} -- -W clippy::all
        continue-on-error: true

      - name: cargo test
        working-directory: src-tauri
        run: cargo test --target ${{ matrix.target }} --no-fail-fast

  # -------------------------------------------------------------------
  # Status: a single gate the branch protection rule can require.
  # -------------------------------------------------------------------
  ci-summary:
    name: CI summary
    runs-on: ubuntu-latest
    needs: [frontend, rust]
    if: always()
    steps:
      - name: Fail if any required job failed
        run: |
          if [[ "${{ needs.frontend.result }}" != "success" || \
                "${{ needs.rust.result }}"     != "success" ]]; then
            echo "frontend=${{ needs.frontend.result }} rust=${{ needs.rust.result }}"
            exit 1
          fi
          echo "All CI jobs green."
