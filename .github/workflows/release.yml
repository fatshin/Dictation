name: Release

# Builds signed macOS DMG + Windows MSI and publishes them as a GitHub
# Release. Triggered by tag push matching v*.
#
# macOS: code-signed + notarised when APPLE_CERTIFICATE secret is present.
# Windows: Authenticode-signed when WINDOWS_CERTIFICATE secret is present.
# Both fall back to unsigned builds when certs are absent.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      draft:
        description: "Create a draft release (no public visibility)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

jobs:
  build:
    name: Build (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS-arm64
            runner: macos-14
            target: aarch64-apple-darwin
            bundle: dmg
          - label: Windows-x64
            runner: windows-2022
            target: x86_64-pc-windows-msvc
            bundle: msi
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      # --- System deps ---
      - name: Install Windows build deps
        if: runner.os == 'Windows'
        run: choco install -y --no-progress llvm cmake
        shell: pwsh

      # --- Rust ---
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: release-${{ matrix.target }}

      # --- macOS: import signing certificate ---
      - name: Import Apple certificate
        if: runner.os == 'macOS' && env.APPLE_CERTIFICATE != ''
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          CERT_PATH=$RUNNER_TEMP/certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          echo "$APPLE_CERTIFICATE" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db

          rm -f "$CERT_PATH"

      # --- Windows: import Authenticode certificate ---
      - name: Import Windows certificate
        if: runner.os == 'Windows' && env.WINDOWS_CERTIFICATE != ''
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        shell: pwsh
        run: |
          $certBytes = [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE)
          $certPath = Join-Path $env:RUNNER_TEMP "certificate.pfx"
          [IO.File]::WriteAllBytes($certPath, $certBytes)

          $securePassword = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          Import-PfxCertificate -FilePath $certPath -CertStoreLocation Cert:\CurrentUser\My -Password $securePassword

          $thumbprint = (Get-PfxCertificate -FilePath $certPath -Password $securePassword).Thumbprint
          echo "WINDOWS_CERT_THUMBPRINT=$thumbprint" >> $env:GITHUB_ENV

          Remove-Item $certPath

      # --- Download Whisper model for bundling ---
      - name: Download Whisper model
        shell: bash
        run: |
          mkdir -p src-tauri/models
          if [ ! -f src-tauri/models/ggml-small.bin ]; then
            curl -L --retry 3 --retry-delay 10 -o src-tauri/models/ggml-small.bin \
              "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-small.bin"
          fi
          ls -lh src-tauri/models/ggml-small.bin

      # --- Build with Tauri ---
      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0.5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI: "true"
          TAURI_CONFIG: '{"bundle":{"resources":{"models/ggml-small.bin":"models/ggml-small.bin"}}}'
          # macOS signing + notarisation
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Windows Authenticode
          TAURI_WINDOWS_SIGN_COMMAND: ${{ runner.os == 'Windows' && env.WINDOWS_CERT_THUMBPRINT != '' && format('signtool.exe sign /sha1 {0} /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 "%1"', env.WINDOWS_CERT_THUMBPRINT) || '' }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Dictation ${{ github.ref_name }}"
          releaseBody: |
            ## Dictation ${{ github.ref_name }}

            Local-first offline dictation with optional LLM rewrite.

            ### Downloads
            - **macOS (Apple Silicon)**: `.dmg` file below
            - **Windows (x64)**: `.msi` file below

            ### Notes
            - Whisper-only mode is the default (no LLM / Ollama required)
            - Configure vocabulary hints in Settings → 一般 → Whisper 初期プロンプト

            ### Verify integrity
            ```bash
            # macOS
            shasum -a 256 Dictation_*.dmg
            # Windows (PowerShell)
            Get-FileHash .\Dictation_*.msi -Algorithm SHA256
            ```
          releaseDraft: ${{ github.event.inputs.draft || 'true' }}
          prerelease: true
          args: --target ${{ matrix.target }}

      # --- Cleanup macOS keychain ---
      - name: Cleanup keychain
        if: runner.os == 'macOS' && always()
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain-db
          if [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi

      # --- Upload artifacts ---
      - name: Upload bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.label }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.sig
          retention-days: 30
