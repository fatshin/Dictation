name: Release

# Builds signed (when certs available) macOS DMG + Windows MSI and
# publishes them as a GitHub Release. Triggered by tag push matching v*.
#
# Phase 4 (MAC_PACKAGING.md M5 + WINDOWS_PLAN.md W7):
# - macOS: universal binary (aarch64 + x86_64 via lipo), notarised when
#   APPLE_CERTIFICATE secret is present. Unsigned otherwise.
# - Windows: x64 MSI, code-signed when WINDOWS_CERTIFICATE secret is
#   present. Unsigned otherwise.
# - Tauri updater JSON (latest.json) for the auto-update channel.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      draft:
        description: "Create a draft release (no public visibility)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

jobs:
  build:
    name: Build (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS-arm64
            runner: macos-14
            target: aarch64-apple-darwin
            bundle: dmg
          - label: Windows-x64
            runner: windows-2022
            target: x86_64-pc-windows-msvc
            bundle: msi
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      # --- System deps (same as ci.yml) ---
      - name: Install Windows build deps
        if: runner.os == 'Windows'
        run: choco install -y --no-progress llvm cmake
        shell: pwsh

      # --- Rust ---
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: release-${{ matrix.target }}

      # --- Build with Tauri ---
      # macOS signing is deferred to Phase 4 (MAC_PACKAGING.md M1-M2).
      # For now we build unsigned bundles. Gatekeeper will show the
      # "developer cannot be verified" warning, but right-click → Open
      # works. CI=true tells the bundler to skip codesign when no
      # certificate is present.
      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0.5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI: "true"
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Dictation ${{ github.ref_name }}"
          releaseBody: |
            ## Dictation ${{ github.ref_name }}

            Local-first offline dictation with optional LLM rewrite.

            ### Downloads
            - **macOS (Apple Silicon)**: `.dmg` file below
            - **Windows (x64)**: `.msi` file below

            ### Notes
            - Whisper-only mode is the default (no LLM / Ollama required)
            - Configure vocabulary hints in Settings → 一般 → Whisper 初期プロンプト
            - This is a pre-release build. Code signing will be added in a future release.

            ### Verify integrity
            ```bash
            # macOS
            shasum -a 256 Dictation_*.dmg
            # Windows (PowerShell)
            Get-FileHash .\Dictation_*.msi -Algorithm SHA256
            ```
          releaseDraft: ${{ github.event.inputs.draft || 'true' }}
          prerelease: true
          args: --target ${{ matrix.target }}

      # --- Upload artifacts (accessible even if release creation fails) ---
      - name: Upload bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.label }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.sig
          retention-days: 30
